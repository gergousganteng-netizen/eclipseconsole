<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="100%" height="100%" fill="#f6f7f9"/>
  <!-- Sidebar -->
  <rect x="0" y="60" width="260" height="840" fill="#ffffff" stroke="#e1e4e8"/>
  <!-- Side panel rail -->
  <rect x="260" y="60" width="48" height="840" fill="#ffffff" stroke="#e1e4e8"/>
  <!-- Main content area -->
  <rect x="308" y="60" width="1132" height="840" fill="#ffffff" stroke="#e1e4e8"/>

  <!-- Titlebar -->
  <rect x="0" y="0" width="1440" height="60" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="20" y="38" font-family="Inter, Arial, sans-serif" font-size="18" fill="#111">EclipseConsole — Side Panel (Attached)</text>

  <!-- Side rail tabs -->
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#111">
    <rect x="270" y="80" width="32" height="48" fill="#f0f4f8" stroke="#cfd8e3" rx="6"/>
    <text x="286" y="110" text-anchor="middle" fill="#111">C</text>
    <rect x="270" y="140" width="32" height="48" fill="#ffffff" stroke="#cfd8e3" rx="6"/>
    <text x="286" y="170" text-anchor="middle" fill="#777">S</text>
  </g>

  <!-- Side panel attached list -->
  <rect x="308" y="90" width="540" height="220" fill="#fbfdff" stroke="#e6eef7" rx="8"/>
  <text x="324" y="116" font-size="14" fill="#333">Attached Clients</text>
  <!-- client row -->
  <g>
    <circle cx="340" cy="150" r="26" fill="#dfefff" stroke="#c2daf8"/>
    <text x="340" y="156" font-size="14" text-anchor="middle" fill="#0b3b66">A</text>
    <text x="380" y="146" font-size="13" fill="#111">DisplayName</text>
    <text x="380" y="164" font-size="12" fill="#666">@username — Game Title</text>
    <rect x="540" y="134" width="72" height="28" rx="6" fill="#fff" stroke="#d1e1f2"/>
    <text x="576" y="153" font-size="13" text-anchor="middle" fill="#d23">Detach</text>
  </g>

  <!-- footer -->
  <rect x="308" y="300" width="540" height="48" fill="#ffffff" stroke="#e1e8f2" rx="6"/>
  <text x="320" y="332" font-size="13" fill="#111">1 client • Launch Roblox</text>

  <!-- Bottom bar placeholder -->
  <rect x="0" y="864" width="1440" height="36" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="1200" y="888" font-size="13" fill="#111" text-anchor="end">PID: 1234  |  Base: 0x7ff… | DataModel</text>
  <circle cx="1140" cy="876" r="5" fill="#4caf50"/>
  <text x="1150" y="880" font-size="12" fill="#666">Attached · DisplayName</text>

  <!-- Toolbar -->
  <rect x="260" y="824" width="820" height="36" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="1140" y="844" font-size="12" fill="#111" text-anchor="end">Save | [Roblox] Launch | Arm  Stop  <tspan font-weight="700">Run</tspan></text>

</svg>
