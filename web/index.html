<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eclipse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="ground">

<div class="window">

  <div class="titlebar">
    <div class="brand">
      <span class="monogram" aria-hidden="true"></span>
      <span class="wordmark">Eclipse</span>
    </div>
    <!-- Edit sits here rather than beside the wordmark so it lands over the
         EDITOR, which is what it acts on -- next to the brand it was over the
         sidebar, pointing at the one pane it has nothing to do with. -->
    <div class="cmdk-group">
      <!-- GEAR MOVED OUT, to .tb-right. It sat here because .cmdk centres with
           margin:0 auto and a bare sibling would have shoved it off-centre --
           a layout workaround deciding where the least-used control in the app
           lived. .cmdk-group is absolutely centred now, so the sides no longer
           have to balance and each control can sit where it belongs. -->
      <!-- Repurposed from the kit's "run a script" field: this searches the
           offset table, which is the thing you actually look up constantly. -->
      <div class="cmdk" id="cmdk" tabindex="0" role="button">
        <span class="lead">⌘</span>
        <span>Search offsets…</span>
        <span class="kbd">⌘K</span>
      </div>
      <!-- Notepad-style Edit menu. Reuses the sidebar's context-menu component
           rather than being a menu bar of its own. -->
      <button class="menu-btn" id="btnEdit">Edit</button>
    </div>
    <!-- Settings and the window controls. Arm was briefly a state chip here
         and lives in the toolbar beside Run and Stop -- it reads better next to
         the other things you press while a snippet is in front of you, and the
         .armed class on the button plus the DataModel readout already make the
         state legible there. -->
    <div class="tb-right">
      <button class="cmdk-gear" id="btnSettings" title="Settings (Ctrl+,)" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    <!-- Windows-style controls rather than the kit's macOS traffic lights. -->
    <div class="wincontrols">
      <button class="wc" id="winMin" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5h10"/></svg>
      </button>
      <button class="wc" id="winZoom" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
      </button>
      <button class="wc close" id="winClose" title="Close" aria-label="Close">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M0 0l10 10M10 0L0 10"/></svg>
      </button>
    </div>
    </div>
  </div>

  <div class="body">

    <aside class="sidebar">
      <div class="side-scroll">
        <!-- "Explorer", not "Snippets": the tree below is already labelled
             Snippets by its own root crumb, and the header saying it too was
             the same word twice in 30px of vertical space. This names the
             PANE; the crumb names what is in it. -->
        <div class="side-label">Explorer <span class="add" id="btnNew" title="New snippet">+</span></div>
        <!-- Where you are, when the tree is showing one folder instead of all
             of them. Hidden until it has something to say. -->
        <div class="crumbs" id="crumbs" hidden></div>
        <!-- tabindex so the list can hold keyboard focus: the arrow/F2/Delete
             keys are bound to THIS element, not the document, or they would
             fire while you were typing in the editor. -->
        <div class="scripts" id="snippetList" tabindex="0"></div>
      </div>
      <!-- The kit's identity footer has no backing here (no accounts), so the
           pinned strip carries the attach readout instead. -->
      <!-- Two rows separated by a hairline: the trash above, the attach
           readout below. The trash is a TOOL (you press it) and the readout is
           a READOUT (you read it); on one shared row they competed for the
           same 208px and neither was quick to find. The rule is what says they
           are different kinds of thing.

           No "Recover deleted" label any more. It was there because a bare bin
           reads as "delete" rather than "undo" -- still true, so the wording
           moved into the tooltip renderTrashCount() writes, which names the
           action and the count. The icon plus the number is the whole message
           at a glance, and the label was spending a third of the sidebar to
           repeat the drawing.

           Launch moved to the toolbar beside the Roblox mark. It only ever
           appeared while detached, which made the footer's height change under
           you, and it belongs with the other things you press. -->
      <div class="side-foot">
        <button class="foot-trash" id="btnTrash" title="Restore deleted snippets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
          </svg>
          <span class="n" id="trashN"></span>
        </button>

        <div class="foot-id">
          <span class="pulse-dot" id="pulse"></span>
          <div class="who" id="footState">No client</div>
        </div>
      </div>
    </aside>

    <!-- Drag to resize the sidebar. Vertical twin of #consoleGrip; a real
         layout column rather than an overlay on the sidebar's right border. -->
    <div class="vsplit" id="sidebarGrip" title="Drag to resize · double-click to reset"></div>

    <div class="main">

      <div class="tabstrip" id="tabstrip">
        <div class="spacer"></div>
      </div>

      <!-- The action bar, UNDER the tabs, because it acts on the file the tabs
           name. It used to be the bottom bar, a whole editor's height away from
           the code it runs.

           READ IT RIGHT TO LEFT. Run is the rightmost control in the window
           because it is the one pressed most, and the groups step away from it
           in that order: run/stop/arm, then the client, then save. So the
           source order here is the reverse of the reading order. -->
      <div class="toolbar">
        <div class="tb-file" id="tbFile"></div>
        <div class="tb-gap"></div>

        <div class="tb-grp">
          <button class="tbtn" id="btnSave" title="Save  (Ctrl+S)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><path d="M8 14h8"/>
            </svg>
            Save
          </button>
        </div>

        <div class="tb-div"></div>

        <div class="tb-grp">
          <!-- ICON ONLY, and the icon is Roblox's own mark -- a tilted square
               with a square hole, one path with fill-rule="evenodd" so the hole
               is a hole and not a second shape painted over the first. The
               brand names the thing better than the word "Attach" did, and
               which state it is in is already spelled out on the sidebar
               readout, so the button does not have to carry that too. -->
          <button class="tbtn icon attach" id="btnAttach" title="Clients" aria-label="Clients">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd"
                    d="M6.2 2.6l15.2 4.1-4.1 15.2-15.2-4.1z
                       M9.97 9.07l5.02 1.35-1.35 5.02-5.02-1.35z"/>
            </svg>
          </button>
          <!-- ALWAYS VISIBLE, attached or not. It used to hide once a client
               was attached, on the reasoning that it had nothing left to do --
               but starting a SECOND client is a real thing to want, and a
               button that vanishes also shifts every control to its left the
               moment the watcher attaches on its own.
               Two icons, one showing at a time: .loading swaps the rocket for
               the spinner. Launching hands a URI to the shell and nothing comes
               back to say it worked, so the spinner is what says the click
               landed -- it stops when a client actually turns up. -->
          <button class="tbtn" id="btnLaunch" title="Start Roblox">
            <svg class="ico-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91 0z"/>
              <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
            </svg>
            <svg class="ico-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round">
              <path d="M12 3a9 9 0 1 0 9 9"/>
            </svg>
            <span class="lbl">Launch</span>
          </button>
        </div>

        <div class="tb-div"></div>

        <div class="tb-grp">
          <button class="tbtn" id="btnArm" title="Writes are logged and never performed. Press to allow them.">Arm</button>
          <!-- Run and Stop are SEPARATE, not one button that changes meaning.
               With several snippets able to run at once, one control cannot
               express both "run this" and "stop which?" -- and a button whose
               label depends on state is the one you misclick. -->
          <button class="tbtn danger" id="btnStop" disabled title="Stop a run">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            <span class="lbl">Stop</span>
          </button>
          <button class="tbtn primary" id="btnRun" title="Run  (F5)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
            <span class="lbl">Run</span>
          </button>
        </div>
      </div>

      <div class="editor-wrap">
        <!-- Find/replace. Floats over the code rather than pushing it down,
             so the line you were looking at does not move when it opens.
             .editor-wrap is already position:relative for the kit's own
             layout, which is what this anchors to. -->
        <div class="findbar" id="findBar" hidden>
          <div class="find-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
            <input type="text" id="findInput" placeholder="Find" autocomplete="off" spellcheck="false">
            <span class="find-count" id="findCount"></span>
            <button class="find-btn" id="findPrev" title="Previous (Shift+F3)">&#8593;</button>
            <button class="find-btn" id="findNext" title="Next (F3)">&#8595;</button>
            <button class="find-btn find-toggle" id="findCase" title="Match case">Aa</button>
            <button class="find-btn find-toggle" id="findRe" title="Regular expression">.*</button>
            <button class="find-btn" id="findClose" title="Close (Esc)">&#10005;</button>
          </div>
          <div class="find-row find-replace" id="findReplaceRow" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round"><path d="M4 10a8 8 0 0 1 13.7-5.7L20 6"/><path d="M20 3v3.5h-3.5"/></svg>
            <input type="text" id="replInput" placeholder="Replace" autocomplete="off" spellcheck="false">
            <button class="find-btn wide" id="replOne">Replace</button>
            <button class="find-btn wide" id="replAll">All</button>
          </div>
        </div>
        <div class="editor">
          <div class="gutter" id="gutter"></div>
          <div class="code-stack">
            <div class="code" id="codeHi"></div>
            <textarea class="code-input" id="codeInput" spellcheck="false"
                      autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
          </div>
        </div>

        <!-- Shown only when no file is open AND the buffer is empty. Not a
             textarea placeholder: the input sits underneath a syntax-highlight
             layer, so a native placeholder would render behind it. It is
             pointer-events:none, because an empty buffer is still a usable one
             -- pasting code in and pressing Run without ever saving is a
             supported way to work here, and this must not intercept the click
             that focuses the editor. -->
        <div class="editor-empty" id="editorEmpty" hidden>
          <div class="ee-title">No file open</div>
          <div class="ee-sub">Pick a snippet from the sidebar, or start typing and press Run.</div>
        </div>
        <!-- Minimap. A canvas rather than the kit's div-per-line .mline bars:
             those are one DOM node per line rebuilt on every keystroke, which
             is fine at 200 lines and not at 5000. The viewport box is a
             separate div so scrolling moves it without redrawing the map. -->
        <div class="minimap" id="minimap" hidden>
          <canvas id="minimapCanvas"></canvas>
          <div class="mm-view" id="minimapView"></div>
        </div>
      </div>

      <!-- Drag to resize the console. A real layout row rather than an overlay
           on the console's top border: the head below is click-to-collapse, and
           a grip floating over it would steal clicks from the top of it. -->
      <div class="hsplit" id="consoleGrip" title="Drag to resize · double-click to reset"></div>
      <div class="console" id="console">
        <div class="console-head" id="consoleHead">
          <div class="console-title">Console <span class="n" id="logCount">0</span></div>
          <div class="filters">
            <button class="chip on" data-lvl="info">info</button>
            <button class="chip on" data-lvl="ok">ok</button>
            <button class="chip on" data-lvl="warn">warn</button>
            <button class="chip on" data-lvl="err">err</button>
          </div>
          <button class="link-btn" id="btnClear">Clear</button>
        </div>
        <div class="log" id="log"></div>
      </div>

      <!-- Purely a readout now -- every button moved to the toolbar -- and 36px
           to match the toolbar, so the editor sits between two bars of the same
           weight. See app.css for the three heights this went through. -->
      <div class="bottombar">
        <div class="status-cluster">
          <div class="stat s-pid"><span class="k">pid</span><span class="v" id="stPid">—</span></div>
          <div class="stat s-base"><span class="k">base</span><span class="v" id="stBase">—</span></div>
          <div class="stat s-off"><span class="k">offsets</span><span class="v" id="stOff">0</span></div>
          <div class="attached" id="stDm">no DataModel</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Resize grips. The window has no non-client frame, and WebView2 covers
       every client pixel with its own child window, so Windows never gets to
       hit-test the edges. These strips take the drag and hand it to the host,
       exactly as the titlebar does for moving. -->
  <div class="resizers" id="resizers">
    <div data-edge="TL"></div> <div data-edge="T"></div> <div data-edge="TR"></div>
  </div>

  <div class="ctx" id="ctxMenu" role="menu"></div>

  <!-- Rename / new-name prompt. Reuses the palette shell so it needs no new
       chrome; the placeholder carries the question. #promptNote carries
       validation ("already exists") inline -- the log is behind the scrim and
       blurred while this is open, so a message posted there is unreadable at
       exactly the moment it matters. -->
  <div class="palette-overlay prompt-overlay" id="promptOverlay">
    <div class="palette" style="width:420px">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <input type="text" id="promptInput" autocomplete="off" spellcheck="false">
        <span class="kbd">⏎</span>
      </div>
      <div class="prompt-note" id="promptNote" hidden></div>
    </div>
  </div>

  <!-- Settings. Its own overlay rather than the .palette shell: that one is
       540px and top-anchored for a growing result list, and this is a fixed
       two-pane layout that wants the height. Rows are built by app.js from
       the SETTINGS table -- there is no markup per setting. -->
  <!-- Export picker. Its own small dialog rather than three checkboxes wedged
       into the settings footer: the counts are the useful part and they need
       room to be read. -->
  <!-- Trash. Deleting moves a snippet to snippets\.trash rather than unlinking
       it, which is only actually a safety net if there is a way back. -->
  <!-- The run/stop chooser. Same shell as the trash and export dialogs, and
       centred like them, so a decision about runs looks like every other
       decision in the app rather than a menu hanging off a button. -->
  <div class="palette-overlay export-overlay" id="runOverlay">
    <div class="palette export-box" role="dialog" aria-label="Runs">
      <div class="palette-input"><span class="set-title" id="runDlgTitle"></span></div>
      <div class="export-listhead">
        <span id="runDlgSub"></span>
        <button class="link-btn" id="runDlgAll" hidden>Select all</button>
      </div>
      <div class="export-list" id="runDlgList"></div>
      <div class="settings-foot" id="runDlgFoot"></div>
    </div>
  </div>

  <div class="palette-overlay export-overlay" id="trashOverlay">
    <div class="palette export-box" role="dialog" aria-label="Trash">
      <div class="palette-input"><span class="set-title">Trash</span></div>
      <div class="export-listhead">
        <span id="trashCount"></span>
        <button class="link-btn danger" id="trashEmpty">Empty trash</button>
      </div>
      <div class="export-list" id="trashList"></div>
      <div class="settings-foot">
        <span class="export-hint" id="trashHint"></span>
        <button class="btn" id="trashClose">Close</button>
      </div>
    </div>
  </div>

  <div class="palette-overlay export-overlay" id="exportOverlay">
    <div class="palette export-box" role="dialog" aria-label="Export bundle">
      <div class="palette-input"><span class="set-title">Export bundle</span></div>
      <div class="export-body">
        <label class="export-row">
          <input type="checkbox" id="expSettings" checked>
          <span class="export-name">Settings</span>
          <span class="export-note" id="expSettingsN"></span>
        </label>
        <label class="export-row">
          <input type="checkbox" id="expOffsets" checked>
          <span class="export-name">Offsets conf</span>
          <span class="export-note" id="expOffsetsN"></span>
        </label>
      </div>
      <div class="export-listhead">
        <span>Snippets</span>
        <button class="link-btn" id="expAll">all</button>
        <button class="link-btn" id="expNone">none</button>
      </div>
      <!-- Built by app.js from the same tree the sidebar shows, so a project
           reads as a project here too. -->
      <div class="export-list" id="expList"></div>
      <div class="settings-foot">
        <span class="export-hint" id="expSummary"></span>
        <button class="btn" id="expCancel">Cancel</button>
        <button class="btn btn-primary" id="expGo">Export…</button>
      </div>
    </div>
  </div>

  <div class="palette-overlay settings-overlay" id="settingsOverlay">
    <div class="palette settings-box" role="dialog" aria-label="Settings">
      <!-- .palette-input is the kit's search row: it already lays out the
           icon, the field and a trailing control, so this needs no styling
           of its own. -->
      <div class="palette-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
        <input type="text" id="setSearch" autocomplete="off" spellcheck="false"
               placeholder="Search settings">
        <button class="icon-btn" id="setClose" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <!-- The kit's .nav, same component the sidebar's primary nav uses. -->
        <div class="settings-cats nav" id="setCats"></div>
        <div class="settings-list" id="setList"></div>
      </div>
      <div class="settings-foot">
        <span id="setCount"></span>
        <button class="btn" id="setImport">Import…</button>
        <button class="btn" id="setExport">Export…</button>
        <button class="btn" id="setReset">Reset all</button>
      </div>
    </div>
  </div>

  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette">
      <!-- .palette-input is the CONTAINER; the field goes inside it, which is
           what makes `.palette-input input { background: transparent }` apply. -->
      <div class="palette-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="paletteInput" placeholder="Search offsets…" autocomplete="off" spellcheck="false">
        <span class="kbd">esc</span>
      </div>
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <!-- The clients panel. Opened by the toolbar's Roblox mark, and still opened
       by the host (OPEN_PICKER:) when an attach finds several clients and needs
       one picked.

       A SLIDE-IN, not the centred modal it replaces. Picking a client is not a
       decision about the document, so it does not deserve the middle of the
       screen; and unlike the modal this is a place you go on purpose to SEE
       what is attached, which a dialog that only appeared on ambiguity could
       never be. The old .cand-* markup is gone with it.

       Absolutely positioned inside .window, so the scrim blurs the app and
       stops short of the window's own rounded frame. -->
  <div class="att-scrim" id="attScrim"></div>
  <aside class="att-panel" id="attPanel" role="dialog" aria-label="Clients">
    <div class="att-head">
      <span class="att-title">Clients</span>
      <!-- Refreshing is one process walk and ~100ms; the panel asks on every
           open, so this is only for watching a client finish loading. -->
      <button class="att-x" id="attRefresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10a8 8 0 0 1 13.7-5.7L20 6"/><path d="M20 3v3.5h-3.5"/>
          <path d="M20 14a8 8 0 0 1-13.7 5.7L4 18"/><path d="M4 21v-3.5h3.5"/>
        </svg>
      </button>
      <button class="att-x" id="attClose" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="att-list" id="attList"></div>
    <div class="att-foot">
      <span class="grow" id="attCount"></span>
      <button class="att-act" id="attLaunch" title="Start Roblox">
        <svg class="ico-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91 0z"/>
