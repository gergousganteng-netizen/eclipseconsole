      var pl = $("place");
      pl.textContent = s.place || "";
      pl.hidden = !s.place;
      var pill = $("armpill");
      // ONE SPELLING, HERE AND IN THE APP'S TITLEBAR CHIP (app.js). This
      // read "ARMED" against a lowercase "dry-run" -- it did not even agree
      // with itself, let alone with the console showing the same fact.
      pill.textContent = s.armed ? "Armed" : "Dry-run";
      // Label = what is true, tooltip = what clicking does. Same split the
      // app's chip uses; a control that named the action would read as a
      // promise that you are safe.
      pill.title = s.armed
        ? "Writes are being performed. Click to go back to logging them."
        : "Writes are logged and never performed. Click to allow them.";
      pill.classList.toggle("armed", !!s.armed);
      var arm = $("arm");
      arm.textContent = s.armed ? "Disarm" : "Arm";
      arm.classList.toggle("on", !!s.armed);

    } else if (type === "HEALTH") {
      var h;
      try { h = JSON.parse(body); } catch (e) { return; }
      var el = $("hp");
      // Hidden rather than zeroed when it cannot be read: in the menu or while
      // dead there is no humanoid, and an empty bar would read as "you are
      // about to die" rather than "there is nothing to report".
      el.hidden = !h.ok;
      if (!h.ok) return;
      var frac = h.max > 0 ? h.hp / h.max : 0;
      el.textContent = h.hp + " HP";
      el.classList.toggle("warn", frac <= 0.6 && frac > 0.3);
      el.classList.toggle("err",  frac <= 0.3);

    } else if (type === "RUNSTATE") {
      var r;
      try { r = JSON.parse(body); } catch (e) { return; }
      $("runrow").classList.toggle("on", !!r.running);
      $("tabdot").classList.toggle("on", !!r.running);
      // Stop is the only button that DOES anything while a snippet runs.
      $("stop").classList.toggle("running", !!r.running);
      // building implies running -- the host only reports it inside a run.
      $("runrow").classList.toggle("building", !!r.building);
      $("tabdot").classList.toggle("building", !!r.building);

      // SEVERAL can be live now. The panel is one narrow line and cannot list
      // four names, so it names ONE and counts the rest -- and the tree below
      // marks every live row, which is where "which ones" is actually answered.
      liveRuns = r.runs || [];
      paintRuns();
      if (pendingAfterStop && !liveRuns.length) {
        var go = pendingAfterStop; pendingAfterStop = null; go();
      }
      var n = liveRuns.length;
      $("runname").textContent =
        !r.running ? (r.name ? r.name + " — stopped" : "nothing running")
        : r.building ? (r.name ? r.name + " — building" : "building")
        : n > 1      ? (r.name + " +" + (n - 1) + " more")
        : (r.name ? r.name : "running");
      // Stop takes everything with it, so say so rather than let a count of
      // four sit next to a button that reads like it stops one.
      $("stop").title = n > 1 ? ("Stop all " + n) : "Stop";

    } else if (type === "SNIPS") {
      var list;
      try { list = JSON.parse(body); } catch (e) { return; }
      renderSnips(list);

    } else if (type === "APPOPEN") {
      // The host's open choreography, leg 1: travel to the rect it names. A
      // panel that is open retracts first -- its own signed-off animation --
      // and the travel starts from the badge when that finishes
      // (pendingAtBadge, run by the #shape transitionend listener).
      if (!composited) return;
      flyHide(true);   // Insert can open the app with the flyout still out
      var pr = body.split(",");
      appRect = { left: +pr[0], top: +pr[1], w: +pr[2], h: +pr[3] };
      if (!isFinite(appRect.w) || appRect.w <= 0) { appRect = null; return; }
      if (expanded) { pendingAtBadge = startAppOpen; setExpanded(false); }
      else startAppOpen();

    } else if (type === "APPSHOWN") {
      // Open leg 3: the real window is composed under the box -- drop it.
      // The badge stays as the close control; its rect is all that remains.
      //
      // STALE-PROOF (2026-09-02). Dropping the stage at the wrong moment is
      // not cosmetic: "on" off means display:none, a display:none element
      // runs NO transition, transitionend never fires, and appAnim wedges
      // TRUE forever -- badge dead (this file gates on appAnim), APPIDLE
      // never sent, and the corridor rect stuck in the region: the permanent
      // dead-rectangle-over-the-game state. Reproduced in a message-order
      // harness against this exact page: APPSHOWN after APPCLOSE, and
      // APPSHOWN after APPGO, both wedge; every other ordering recovers.
      // So: an APPSHOWN after a close began (appOpen false) is stale -- the
      // stage belongs to the close now, ignore it outright; one landing
      // before the open travel ended (the host's 1.5s open watchdog can beat
      // our transitionend) defers the drop to the travel's end.
      if (!appOpen) { /* stale: a close owns the stage */ }
      else if (appAnim) { shownPending = true; }
      else {
        stage.classList.remove("on");
        reportRects();
        // The box is gone and the app composed under it: tell the host it can
        // move the overlay to its steady slot under the app now (Fault A).
        send("APPUNCOVER");
      }

    } else if (type === "APPCLOSE") {
      // The host's close choreography, leg 1: the window's current rect.
      if (!composited) return;
      var cr = body.split(",");
      appRect = { left: +cr[0], top: +cr[1], w: +cr[2], h: +cr[3] };
      pendingAtBadge = null;   // a queued open must not fire after a close
      startAppClose();

    } else if (type === "APPGO") {
      // Close leg 2: the window is hidden; travel the box home.
      startAppTravelHome();

    } else if (type === "OVERLAYMODE") {
      // Where the console lives. Only changes what the BADGE opens and
      // whether the badge is shown at all -- entering and leaving app mode
      // stay the host's call (APPOPEN/APPCLOSE), so a preference flip never
      // yanks the view out from under a click. Rects re-reported: with the
      // panel disabled the badge's rect exists exactly because of this flag.
      overlayMode = body !== "0";
      if (!overlayMode) flyHide(true);   // the choice only exists in overlay mode
      applyRootVisibility();
      reportRects();

    } else if (type === "HUDVIS") {
      // The console panel's visibility, runtime edition (Settings toggle).
      // The window stays for the dock; only this element and its rects go.
      hudVisible = body !== "0";
      applyRootVisibility();   // app mode keeps #root shown regardless
      reportRects();

    } else if (type === "DOCKP") {
      if (!composited) return;   // fallback window cannot host a panel
      var cfg;
      try { cfg = JSON.parse(body); } catch (e) { return; }
      applyDock(cfg);

    } else if (type === "HOTKEY") {
      // Insert, with nothing open. The host closes an open APP itself and
      // never gets here for that case -- that is the escape hatch and it must
      // not depend on this page being alive. Everything else is the badge's
      // own decision, so it runs the badge's action: in panel mode Insert
      // opens the panel, which is the whole point. Asked for because a game
      // holding the mouse makes the keyboard the ONLY way in, and it used to
      // open the app whatever the badge was set to.
      badgeAction();

    } else if (type === "CLICKAWAY") {
      // The host's LL hook: a button landed OUTSIDE the overlay while the
      // flyout was out. Those clicks route to the game and this document
      // never hears them, so the hook is the only dismisser they can have.
      flyHide(false);

    } else if (type === "DOCKEVAL") {
      // fx_window_eval, crossing into the snippet's origin. This page only
      // CARRIES the script -- the injected shim in the iframe evals it
      // there, where it can touch nothing of ours.
      if (dock && dock.frame.contentWindow)
        dock.frame.contentWindow.postMessage({ __ec_eval: body }, "*");
    }
  };

  // First rects, as soon as the layout exists: until the host hears this the
  // overlay window has an EMPTY region and even the panel is click-through.
  // (In overlay mode this is the badge alone -- the collapsed start.)
  reportRects();
})();
</script>
</body>
</html>
